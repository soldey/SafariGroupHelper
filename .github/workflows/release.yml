name: Release

# Every push to main is inspected: if it carries a feat/fix/release commit, the version is
# bumped accordingly, the mod is built and a GitHub release is published. Pushes that only
# contain other commits do nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Referenced in an `if:`, which cannot read `secrets` directly.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          chmod +x scripts/*.sh
          version=$(scripts/next-version.sh)
          if [ -z "$version" ]; then
            echo "No feat/fix/release commit since the last tag, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Next version: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew build -PmodVersion=${{ steps.version.outputs.version }}

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/changelog.sh "v$VERSION" > /tmp/notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Safari Group Helper $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            "build/libs/safari-group-helper-$VERSION.jar" \
            "build/libs/safari-group-helper-$VERSION-sources.jar" \
            --title "Safari Group Helper $VERSION" \
            --notes-file /tmp/notes.md

      # Skipped silently until the MODRINTH_PROJECT_ID variable and the MODRINTH_TOKEN secret
      # are set on the repository, so the GitHub release never depends on Modrinth being set up.
      - name: Publish to Modrinth
        if: steps.version.outputs.skip != 'true' && vars.MODRINTH_PROJECT_ID != '' && env.MODRINTH_TOKEN != ''
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: build/libs/safari-group-helper-${{ steps.version.outputs.version }}.jar
          name: Safari Group Helper ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: /tmp/notes.md
          loaders: fabric
          # Keep in step with `minecraftDependency` in gradle.properties.
          game-versions: |
            26.1
            26.1.1
            26.1.2
          java: 25
          # Loader dependencies are read straight from fabric.mod.json.
