name: Release

# Every push to main is inspected: if it carries a feat/fix/release commit, the version is
# bumped accordingly, the mod is built and a GitHub release is published. Pushes that only
# contain other commits do nothing.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          chmod +x scripts/*.sh
          version=$(scripts/next-version.sh)
          if [ -z "$version" ]; then
            echo "No feat/fix/release commit since the last tag, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Next version: $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        if: steps.version.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew build -PmodVersion=${{ steps.version.outputs.version }}

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/changelog.sh > /tmp/notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Safari Group Helper $VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            "build/libs/safari-group-helper-$VERSION.jar" \
            "build/libs/safari-group-helper-$VERSION-sources.jar" \
            --title "Safari Group Helper $VERSION" \
            --notes-file /tmp/notes.md
